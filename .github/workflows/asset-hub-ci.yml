name: RobloxMID CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migrate Roblox audio naming policy
        shell: bash
        run: |
          if ! grep -q 'ROBLOXMID_NEUTRAL_NAME_V1' server/roblox.js; then
            python3 <<'PY'
            from pathlib import Path

            roblox = Path('server/roblox.js')
            index = Path('server/index.js')
            r = roblox.read_text(encoding='utf-8')
            i = index.read_text(encoding='utf-8')

            helper = '''
            const ROBLOX_NAME_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

            function generateRobloxAssetName() {
              const bytes = crypto.randomBytes(10);
              let suffix = "";
              for (const byte of bytes) suffix += ROBLOX_NAME_ALPHABET[byte % ROBLOX_NAME_ALPHABET.length];
              return `RBX-AUDIO-${suffix}`; // ROBLOXMID_NEUTRAL_NAME_V1
            }
            '''

            needle = 'const ROBLOX_MAX_BYTES = 20 * 1024 * 1024;\n'
            if needle not in r:
                raise SystemExit('Roblox size constant not found.')
            r = r.replace(needle, needle + helper, 1)

            old_request = '''    const request = {
              assetType: "Audio",
              displayName: String(displayName),
              description: String(description || ""),
              creationContext: { creator: { userId: String(userId) } }
            };'''
            new_request = '''    const robloxName = generateRobloxAssetName();
            const request = {
              assetType: "Audio",
              displayName: robloxName,
              description: String(description || ""),
              creationContext: { creator: { userId: String(userId) } }
            };'''
            if old_request not in r:
                raise SystemExit('Roblox audio request block not found.')
            r = r.replace(old_request, new_request, 1)

            r = r.replace(
                'return { status: "completed", operationId: null, assetId: String(directAssetId), moderation: normalizeModerationState(created?.moderationResult?.moderationState) };',
                'return { status: "completed", operationId: null, assetId: String(directAssetId), robloxName, moderation: normalizeModerationState(created?.moderationResult?.moderationState) };',
                1,
            )
            r = r.replace(
                'return { status: "completed", operationId, assetId: String(assetId), moderation: normalizeModerationState(op?.response?.moderationResult?.moderationState) };',
                'return { status: "completed", operationId, assetId: String(assetId), robloxName, moderation: normalizeModerationState(op?.response?.moderationResult?.moderationState) };',
                1,
            )
            r = r.replace(
                'return { status: "processing", operationId };',
                'return { status: "processing", operationId, robloxName };',
                1,
            )
            roblox.write_text(r, encoding='utf-8')

            old_record = 'roblox: { status: "pending" },'
            if old_record not in i:
                raise SystemExit('History Roblox record not found.')
            i = i.replace(old_record, 'roblox: { status: "pending", name: null },', 1)

            old_assignment = '''        item.roblox = {
          status: result.status,
          assetId: result.assetId || null,
          operationId: result.operationId || null,
          moderation: result.moderation || (result.assetId ? "reviewing" : null),
          error: result.error || null
        };'''
            new_assignment = '''        item.roblox = {
          status: result.status,
          name: result.robloxName || item.roblox?.name || null,
          assetId: result.assetId || null,
          operationId: result.operationId || null,
          moderation: result.moderation || (result.assetId ? "reviewing" : null),
          error: result.error || null
        };'''
            if old_assignment not in i:
                raise SystemExit('History Roblox assignment not found.')
            i = i.replace(old_assignment, new_assignment, 1)

            old_desc = '          description: `Uploaded with Roblox Music Uploader — ${record.originalName}`,\n'
            if old_desc not in i:
                raise SystemExit('Roblox description line not found.')
            i = i.replace(old_desc, '          description: "Uploaded with Roblox Music Uploader",\n', 1)
            index.write_text(i, encoding='utf-8')
            PY

            node --check server/index.js
            node --check server/roblox.js
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server/index.js server/roblox.js
            git commit -m "feat: separate Telegram and Roblox asset names [roblox-name-separation]"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run repository check
        run: npm run check

      - name: Validate canonical runtime/UI structure
        run: |
          test ! -e server/youtube-download-fallback.js
          test ! -e public/playlist-ui-fix.js
          test ! -e package.tmp-audit
          test -e public/queue-ui.js
          grep -R -nE 'queue-ui\.js' public/index.html public/app.js public/playlist-pagination.js public/queue-ui.js
          if grep -R -nE 'youtube-download-fallback|playlist-ui-fix|package\.tmp-audit' server public package.json Dockerfile docker-compose.yml; then
            echo 'Obsolete runtime/UI reference found.'
            exit 1
          fi

      - name: Validate cleanup and upload limits
        run: |
          grep -q 'safeUnlink(originalFilePath)' server/index.js
          grep -q 'safeUnlink(convertedFilePath)' server/index.js
          grep -q 'MAX_FILE_SIZE_MB=500' .env.example
          grep -q 'MAX_FILE_SIZE_MB=500' docker-compose.yml

      - name: Reject accidental CommonJS in ESM server
        run: |
          if grep -R -nE '(^|[^A-Za-z])(require\(|module\.exports)' server --include='*.js'; then
            echo 'CommonJS syntax found in server/. package.json uses type=module.'
            exit 1
          fi

      - name: Validate environment template
        run: |
          test -s .env.example
          ! grep -nE '(^|[[:space:]])-e([[:space:]]|$)' .env.example

      - name: Validate Docker and healthcheck wiring
        run: |
          grep -q 'CMD \["npm","start"\]' Dockerfile
          grep -q 'healthcheck:' docker-compose.yml
          grep -q '/api/assets/health' docker-compose.yml

      - name: Validate Asset Hub HTML wiring
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('public/assets/index.html', 'utf8');
          const js = fs.readFileSync('public/assets/app.js', 'utf8');
          const pro = fs.readFileSync('public/assets/pro-features.js', 'utf8');
          const requiredIds = [
            'fileInput','dropzone','typeGrid','assetName','creatorType','groupField',
            'description','advancedPanel','concurrency','duplicatePolicy','nameTemplate',
            'uploadAll','queuePanel','queueList','retryFailed','pauseQueue','clearQueue',
            'historyList','assetSearch','exportManifest','clearHistory','inspectorPanel',
            'inspectorTitle','inspectorBody','modal','modalBody','modalClose','toast'
          ];
          const missing = requiredIds.filter(id => !new RegExp(`id=["']${id}["']`).test(html));
          if (missing.length) {
            console.error('Missing Asset Hub IDs:', missing.join(', '));
            process.exit(1);
          }
          const expectedHandlers = ['uploadAll','retryFailed','clearQueue','pauseQueue','exportManifest','openInspectorTop','quickInspect','quickLua','quickManifest','newWorkspace','switchWorkspace'];
          const unwired = expectedHandlers.filter(id => !js.includes(`$('${id}')`));
          if (unwired.length) {
            console.error('Expected UI handlers not referenced:', unwired.join(', '));
            process.exit(1);
          }
          for (const file of ['pro-features.js','pro-features.css']) {
            if (!html.includes(`./${file}`)) {
              console.error('Missing Asset Hub Pro wiring:', file);
              process.exit(1);
            }
          }
          for (const marker of ['Smart Asset Scanner','Asset ID Toolbox','Asset Collections','Asset Health','Asset Analytics','Version Diff','Studio Snippets','PRO PIPELINE']) {
            if (!pro.includes(marker) && !html.includes(marker)) {
              console.error('Missing Asset Hub Pro feature marker:', marker);
              process.exit(1);
            }
          }
          console.log('Asset Hub HTML/JS/Pro wiring OK');
          NODE
