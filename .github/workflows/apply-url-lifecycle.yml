name: Apply URL lifecycle migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migration
        run: node scripts/apply-url-lifecycle.mjs

      - name: Validate changed runtime files
        run: |
          npm ci --omit=dev
          node --check server/index.js
          node --check server/telegram.js
          node --check public/app.js
          npm run check
          git diff --check
          grep -q 'retry-roblox' server/index.js
          grep -q 'ROBLOXMID_TELEGRAM_ARCHIVE_V1' server/telegram.js
          grep -q 'ROBLOXMID_URL_LIFECYCLE_V1' public/app.js

      - name: Remove migration helpers
        run: |
          rm -f scripts/apply-url-lifecycle.mjs .github/workflows/apply-url-lifecycle.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js server/telegram.js public/app.js scripts/apply-url-lifecycle.mjs .github/workflows/apply-url-lifecycle.yml
          git diff --cached --check
          git commit -m "feat: harden URL upload lifecycle and Roblox retry [url-lifecycle]"
          git push
