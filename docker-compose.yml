services:
  bgutil:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-pot-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:4416:4416"

  roblox-music-uploader:
    build: .
    container_name: roblox-music-uploader
    restart: unless-stopped
    depends_on:
      - bgutil
    env_file:
      - .env
    environment:
      - BGUTIL_HTTP_BASE_URL=http://bgutil:4416
      - MAX_FILE_SIZE_MB=500
    ports:
      - "127.0.0.1:8788:8787"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/assets/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
