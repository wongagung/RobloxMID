services:
  roblox-music-uploader:
    build: .
    container_name: roblox-music-uploader
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8788:8787"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8787/"]
      interval: 30s
      timeout: 5s
      retries: 3